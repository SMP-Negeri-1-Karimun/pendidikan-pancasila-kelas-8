        function App() {
            // State Application
            const [stage, setStage] = useState('login'); // 'login', 'exam', 'finished'
            const [student, setStudent] = useState(() => JSON.parse(localStorage.getItem('sas_student')) || { nama: '', jk: '', kelas: '', token: '' });
            const [answers, setAnswers] = useState(() => JSON.parse(localStorage.getItem('sas_answers')) || {});
            const [cheats, setCheats] = useState(() => parseInt(localStorage.getItem('sas_cheats')) || 0);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [resultMessage, setResultMessage] = useState("");
            
            // State untuk Custom Modal menggantikan alert() dan confirm()
            const [modal, setModal] = useState({ isOpen: false, type: 'alert', title: '', message: '', action: null });

            const soalRefs = useRef([]);

            // ==== CONFIGURATION URL APP SCRIPT DISINI ====
            const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTjW6wyl3qOLycjrtYxl6eSRStpUgHLyfmcEq0BWZNu1bkUkQ9lx7xnbyta8dKln44/exec"; 
            // =============================================

            // SINKRONISASI KE LOCALSTORAGE
            useEffect(() => {
                localStorage.setItem('sas_student', JSON.stringify(student));
                localStorage.setItem('sas_answers', JSON.stringify(answers));
                localStorage.setItem('sas_cheats', cheats.toString());
            }, [student, answers, cheats]);

            // SISTEM ANTI CURANG (DETEKSI PINDAH TAB/APLIKASI)
            useEffect(() => {
                const handleVisibilityChange = () => {
                    if (document.hidden && stage === 'exam') {
                        setCheats(prev => {
                            const newCheats = prev + 1;
                            setModal({
                                isOpen: true,
                                type: 'alert',
                                title: '🚨 PERINGATAN KECURANGAN! 🚨',
                                message: `Anda terdeteksi berpindah layar/aplikasi.\nKecurangan tercatat: ${newCheats} kali.\nSetiap pelanggaran akan mengurangi nilai akhir Anda.`,
                                action: null
                            });
                            return newCheats;
                        });
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                window.addEventListener('blur', handleVisibilityChange); // Fallback

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    window.removeEventListener('blur', handleVisibilityChange);
                };
            }, [stage]);

            // LOGIN HANDLER
            const handleLogin = (e) => {
                e.preventDefault();
                if (student.token === 'PP2026') {
                    setStage('exam');
                } else {
                    setModal({ isOpen: true, type: 'alert', title: 'Token Salah', message: 'Silakan masukkan token yang valid.', action: null });
                }
            };

            // JAWABAN HANDLER
            const handleAnswer = (questionId, optionKey) => {
                setAnswers(prev => ({ ...prev, [questionId]: optionKey }));
            };

            // SCROLL NAVIGASI
            const scrollToSoal = (index) => {
                setCurrentQuestion(index);
                if(soalRefs.current[index]){
                    soalRefs.current[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            };

            // SUBMIT HANDLERS
            const handleSubmitClick = () => {
                if(Object.keys(answers).length < QUESTIONS.length) {
                    setModal({ isOpen: true, type: 'confirm', title: 'Konfirmasi', message: 'Ada soal yang belum dijawab! Yakin ingin mengumpulkan?', action: executeSubmit });
                } else {
                    setModal({ isOpen: true, type: 'confirm', title: 'Konfirmasi', message: 'Yakin ingin mengumpulkan jawaban?', action: executeSubmit });
                }
            };

            const executeSubmit = async () => {
                setModal({ isOpen: false, type: 'alert', title: '', message: '', action: null });
                setIsSubmitting(true);
                
                // Kalkulasi Nilai
                let correctCount = 0;
                QUESTIONS.forEach(q => {
                    if (answers[q.id] === q.correct) correctCount++;
                });
                
                // Perhitungan: (Benar x 2) - (Kecurangan x 2)
                let finalScore = (correctCount * 2) - (cheats * 2);
                if(finalScore < 0) finalScore = 0; // Nilai tidak boleh minus (opsional)

                const payload = {
                    nama: student.nama,
                    jenisKelamin: student.jk,
                    kelas: student.kelas,
                    token: student.token,
                    jumlahBenar: correctCount,
                    jumlahKecurangan: cheats,
                    totalNilai: finalScore,
                    jawaban: answers
                };

                try {
                    // Mengirim POST request. Menggunakan text/plain agar tidak diblokir CORS preflight.
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', 
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    // Clear local storage after success
                    localStorage.removeItem('sas_student');
                    localStorage.removeItem('sas_answers');
                    localStorage.removeItem('sas_cheats');
                    
                    setResultMessage("Jawaban berhasil dikirim! Silakan tinggalkan ruangan dengan tertib.");
                    setStage('finished');
                } catch (error) {
                    setModal({ isOpen: true, type: 'alert', title: 'Error Koneksi', message: 'Terjadi kesalahan koneksi internet. Silakan coba klik Kirim lagi.', action: null });
                    console.error(error);
                } finally {
                    setIsSubmitting(false);
                }
            };

            // ---- RENDER COMPONENTS ----
            const ModalUI = () => {
                if (!modal.isOpen) return null;
                return (
                    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                        <div className="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full">
                            <h3 className="text-xl font-bold mb-4 text-gray-800">{modal.title}</h3>
                            <p className="text-gray-600 mb-6 whitespace-pre-line">{modal.message}</p>
                            <div className="flex justify-end gap-3">
                                {modal.type === 'confirm' && (
                                    <button onClick={() => setModal({ ...modal, isOpen: false })} className="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 font-medium">Batal</button>
                                )}
                                <button 
                                    onClick={() => {
                                        if (modal.action) modal.action();
                                        else setModal({ ...modal, isOpen: false });
                                    }} 
                                    className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-medium"
                                >
                                    {modal.type === 'confirm' ? 'Ya, Lanjutkan' : 'Tutup'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // ---- RENDER LOGIN PAGE ----
            if (stage === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 relative">
                        <ModalUI />
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border-t-4 border-blue-600">
                            <div className="flex justify-center mb-4">
                                <img src="https://i.ibb.co.com/TxwtMFDD/Screenshot-2024-08-29-125749.png" alt="Logo SMPN 1 Karimun" className="h-24 object-contain" />
                            </div>
                            <div className="text-center mb-6">
                                <h1 className="text-xl font-bold text-gray-800">SUMATIF AKHIR SEMESTER</h1>
                                <h2 className="text-md font-semibold text-gray-700">TAHUN PELAJARAN 2025/2026</h2>
                                <h3 className="text-sm font-medium text-gray-600">SMP NEGERI 1 KARIMUN</h3>
                                <p className="text-blue-600 font-bold mt-2 border border-blue-200 inline-block px-3 py-1 rounded bg-blue-50">STUDI: PENDIDIKAN PANCASILA</p>
                            </div>
                            
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Nama Murid</label>
                                    <input required type="text" className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" 
                                        value={student.nama} onChange={e => setStudent({...student, nama: e.target.value.toUpperCase()})} />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Jenis Kelamin</label>
                                    <select required className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                        value={student.jk} onChange={e => setStudent({...student, jk: e.target.value})}>
                                        <option value="">-- Pilih Jenis Kelamin --</option>
                                        <option value="L">Laki-Laki</option>
                                        <option value="P">Perempuan</option>
                                    </select>
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Kelas</label>
                                    <select required className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                        value={student.kelas} onChange={e => setStudent({...student, kelas: e.target.value})}>
                                        <option value="">-- Pilih Kelas --</option>
                                        {[1,2,3,4,5,6,7,8].map(num => (
                                            <option key={num} value={`8.${num}`}>8.{num}</option>
                                        ))}
                                    </select>
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Token Ujian</label>
                                    <input required type="text" className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="Masukkan Token"
                                        value={student.token} onChange={e => setStudent({...student, token: e.target.value})} />
                                    <p className="text-xs text-gray-500 mt-1">Hanya bisa dimulai dengan token yang benar.</p>
                                </div>
                                
                                <button type="submit" className="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                    Mulai Ujian
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // ---- RENDER FINISHED PAGE ----
            if (stage === 'finished') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full text-center">
                            <div className="flex justify-center mb-6">
                                <img src="https://i.ibb.co.com/TxwtMFDD/Screenshot-2024-08-29-125749.png" alt="Logo SMPN 1 Karimun" className="h-24 object-contain" />
                            </div>
                            <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg className="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">Ujian Selesai!</h2>
                            <p className="text-gray-600 mb-6">{resultMessage}</p>
                            <p className="text-sm text-gray-500 mb-4">Terima kasih {student.nama}, jawaban Anda sudah tersimpan dengan aman.</p>
                            <button onClick={() => window.location.reload()} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Tutup Halaman</button>
                        </div>
                    </div>
                );
            }

            // ---- RENDER EXAM PAGE ----
            return (
                <div className="min-h-screen flex flex-col md:flex-row max-w-7xl mx-auto relative">
                    <ModalUI />
                    {/* Header Mobile - Peringatan */}
                    <div className="md:hidden bg-red-100 p-2 text-center text-red-800 text-sm font-bold sticky top-0 z-50">
                        🚨 DILARANG PINDAH APLIKASI/LAYAR 🚨
                    </div>

                    {/* MAIN CONTENT SOAL */}
                    <div className="flex-1 p-4 md:p-6 h-screen overflow-y-auto scroll-smooth pb-32 md:pb-6" style={{ scrollBehavior: 'smooth' }}>
                        <div className="flex justify-center mb-6">
                            <img src="https://i.ibb.co.com/TxwtMFDD/Screenshot-2024-08-29-125749.png" alt="Logo SMPN 1 Karimun" className="h-20 object-contain" />
                        </div>
                        <div className="bg-white p-4 rounded-lg shadow mb-6 border-l-4 border-blue-500">
                            <h2 className="font-bold text-lg">{student.nama} - Kelas {student.kelas}</h2>
                            <p className="text-sm text-gray-600">Pendidikan Pancasila | Total: {QUESTIONS.length} Soal</p>
                            {cheats > 0 && <p className="text-sm text-red-600 font-bold mt-2">Kecurangan tercatat: {cheats} kali</p>}
                        </div>

                        <div className="space-y-6">
                            {QUESTIONS.map((q, index) => (
                                <div 
                                    key={q.id} 
                                    id={`soal-${index}`}
                                    ref={el => soalRefs.current[index] = el}
                                    className={`bg-white p-6 rounded-lg shadow-sm border ${currentQuestion === index ? 'border-blue-400 ring-2 ring-blue-100' : 'border-gray-200'}`}
                                >
                                    <div className="flex gap-4">
                                        <div className="font-bold text-lg">{index + 1}.</div>
                                        <div className="flex-1">
                                            <p className="text-gray-800 mb-4 whitespace-pre-line">{q.text}</p>
                                            <div className="space-y-2">
                                                {Object.entries(q.options).map(([key, value]) => (
                                                    <label key={key} className={`flex items-start p-3 border rounded cursor-pointer transition-colors ${answers[q.id] === key ? 'bg-blue-50 border-blue-400' : 'hover:bg-gray-50 border-gray-200'}`}>
                                                        <input 
                                                            type="radio" 
                                                            name={`question-${q.id}`} 
                                                            value={key}
                                                            checked={answers[q.id] === key}
                                                            onChange={() => handleAnswer(q.id, key)}
                                                            className="mt-1 mr-3 h-4 w-4 text-blue-600" 
                                                        />
                                                        <span className="text-sm text-gray-700"><span className="font-semibold uppercase mr-2">{key}.</span> {value}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="mt-8 flex justify-end mb-20 md:mb-0">
                            <button 
                                onClick={handleSubmitClick} 
                                disabled={isSubmitting}
                                className={`px-8 py-3 rounded-lg font-bold text-white shadow-lg transition-transform hover:scale-105 ${isSubmitting ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700'}`}
                            >
                                {isSubmitting ? 'Mengirim Data...' : 'KIRIM JAWABAN SEKARANG'}
                            </button>
                        </div>
                    </div>

                    {/* SIDEBAR NAVIGASI SOAL */}
                    <div className="w-full md:w-80 bg-white shadow-[-4px_0_15px_-3px_rgba(0,0,0,0.1)] p-4 flex flex-col h-64 md:h-screen fixed md:sticky bottom-0 md:top-0 z-40 border-t md:border-t-0 border-gray-200">
                        <div className="hidden md:block mb-4 text-center p-3 bg-red-100 text-red-800 rounded-lg text-sm font-bold border border-red-300 shadow-sm">
                            🚨 DILARANG PINDAH LAYAR/TAB<br/>Kecurangan akan mengurangi nilai!
                        </div>
                        
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-gray-700">Navigasi Soal</h3>
                            <span className="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full font-bold">
                                Dijawab: {Object.keys(answers).length}/{QUESTIONS.length}
                            </span>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto hide-scrollbar">
                            <div className="grid grid-cols-5 gap-2">
                                {QUESTIONS.map((q, index) => {
                                    const isAnswered = answers[q.id] !== undefined;
                                    const isCurrent = currentQuestion === index;
                                    return (
                                        <button 
                                            key={q.id}
                                            onClick={() => scrollToSoal(index)}
                                            className={`h-10 w-full rounded flex items-center justify-center text-sm font-semibold border transition-all
                                                ${isAnswered ? 'bg-green-500 text-white border-green-600' : 'bg-gray-100 text-gray-600 border-gray-300'}
                                                ${isCurrent ? 'ring-2 ring-offset-1 ring-blue-500' : ''}
                                            `}
                                        >
                                            {index + 1}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                        
                        {/* Mobile Submit Button di Navigasi */}
                        <div className="md:hidden mt-4">
                             <button 
                                onClick={handleSubmitClick} 
                                disabled={isSubmitting}
                                className="w-full py-2 bg-green-600 text-white rounded font-bold"
                            >
                                {isSubmitting ? 'Mengirim...' : 'KIRIM JAWABAN'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
